name: release-client

# The remote companion has its own version and releases, tagged client/v*.
# They are never GitHub's latest release, so latest keeps naming tmag for
# people, scripts/install.sh and the pages workflow, and they move no tmag
# or plugin version.
on:
  push:
    tags: ['client/v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Check version
        run: |
          want="${GITHUB_REF_NAME#client/v}"
          grep -q "Version = \"$want\"" internal/version/version.go || { echo "tag $GITHUB_REF_NAME does not match client/internal/version"; exit 1; }
      - name: Build
        # Archives hold tmag-client at the root, beside LICENSE and README.md.
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="tmag-client_${GITHUB_REF_NAME#client/v}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "build/$name/tmag-client" ./cmd/tmag-client
            cp ../LICENSE README.md "build/$name/"
            tar -C "build/$name" -czf "dist/$name.tar.gz" tmag-client LICENSE README.md
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: client/dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --latest=false
