name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - name: Check version
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "Version = \"$want\"" internal/version/version.go || { echo "tag $GITHUB_REF_NAME does not match internal/version"; exit 1; }
      - name: Build
        # Archives hold tmag at the root, the layout mise, aqua and eget expect.
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="tmag_${GITHUB_REF_NAME#v}_${os}_${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags '-s -w' -o "build/$name/tmag" ./cmd/tmag
            cp LICENSE README.md "build/$name/"
            tar -C "build/$name" -czf "dist/$name.tar.gz" tmag LICENSE README.md
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
