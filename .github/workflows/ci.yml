name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request keeps only its latest push running; every commit on main
# runs to the end in a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      go: ${{ steps.go.outputs.version }}
      matrix: ${{ steps.split.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # Documentation outside the plugins feeds no check, so a change to it
      # alone skips every job but ci, which still reports.
      - id: changes
        name: Detect code changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=HEAD^1 # a pull request's merge commit has its base first
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$BEFORE
            git fetch --quiet --depth=1 origin "$base" || base=
          fi
          if [ -n "$base" ] &&
            git diff --quiet "$base" HEAD -- . ':!*.md' ':!docs/' ':!LICENSE' ':!.github/ISSUE_TEMPLATE/' &&
            git diff --quiet "$base" HEAD -- plugins/; then
            echo code=false >> "$GITHUB_OUTPUT"
          else
            echo code=true >> "$GITHUB_OUTPUT"
          fi
      # Every job of a run uses the same release, the latest one.
      - id: go
        name: Resolve the Go release
        run: |
          version=$(curl -fsSL --retry 3 'https://go.dev/VERSION?m=text' | sed -n '1s/^go//p')
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no Go release in go.dev's answer: '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: e2e-durations
          key: e2e-durations-${{ github.run_id }}
          restore-keys: e2e-durations-
      # The end-to-end tests run one after another, so they are split across
      # machines: longest first, each onto the least loaded shard, by the
      # durations main last recorded on that OS (the average for a test
      # without one). The last shard runs every test the others do not, so a
      # test always runs somewhere.
      - id: split
        name: Split the end-to-end tests
        env:
          SHARDS: 3
        run: |
          touch e2e-durations
          sed -n 's/^func \(Test[A-Za-z0-9_]*\)(.*/\1/p' internal/e2e/*_test.go | grep -vx TestMain | sort -u > tests
          awk 'FILENAME == ARGV[1] { t[$1]; next } $2 in t' tests e2e-durations > known
          matrix=$(for os in ubuntu-latest macos-latest; do
            avg=$(awk -v os="$os" '$1 == os { s += $3; n++ } END { print n ? s / n : 1 }' known)
            awk -v os="$os" -v avg="$avg" 'FILENAME == ARGV[1] { if ($1 == os) w[$2] = $3; next } { print ($1 in w ? w[$1] : avg), $1 }' known tests |
              sort -k1,1gr -k2,2 |
              awk -v os="$os" -v n="$SHARDS" '
                {
                  k = 1
                  for (i = 2; i <= n; i++) if (load[i] < load[k]) k = i
                  load[k] += $1
                  names[k] = names[k] (names[k] == "" ? "" : "|") $2
                }
                END {
                  printf "{\"os\":\"%s\",\"suite\":{\"name\":\"unit\"}}", os
                  for (i = 1; i < n; i++) {
                    printf ",{\"os\":\"%s\",\"suite\":{\"name\":\"e2e-%d/%d\",\"run\":\"^(%s)$\"}}", os, i, n, names[i]
                    others = others (others == "" ? "" : "|") names[i]
                  }
                  printf ",{\"os\":\"%s\",\"suite\":{\"name\":\"e2e-%d/%d\",\"skip\":\"^(%s)$\"}}\n", os, n, n, others
                }'
          done | paste -sd, -)
          echo "matrix=[$matrix]" >> "$GITHUB_OUTPUT"
          jq . <<< "[$matrix]"

  test:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.suite.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ needs.plan.outputs.go }}
          build-cache: race-${{ matrix.suite.name == 'unit' && 'unit' || 'e2e' }}
      # Homebrew takes about fifteen seconds to pour tmux and its
      # dependencies, and pours the same files on the same image: they are
      # kept per image. Ubuntu images come with tmux.
      - id: image
        if: runner.os == 'macOS'
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tmux.tar
          key: tmux-${{ steps.image.outputs.version }}-${{ runner.arch }}
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            archive=$RUNNER_TEMP/tmux.tar prefix=$(brew --prefix)
            if ! { [ -f "$archive" ] && tar -xf "$archive" -C "$prefix" && tmux -V; }; then
              brew install tmux
              # shellcheck disable=SC2046 # one path per formula
              tar -cf "$archive" -C "$prefix" bin/tmux $(for f in tmux $(brew deps tmux); do echo "Cellar/$f opt/$f"; done)
            fi
          elif ! command -v tmux > /dev/null; then
            sudo apt-get update && sudo apt-get install -y tmux
          fi
          tmux -V
      # The unit suite runs tmag's extensions for Pi and oh-my-pi, on a
      # Node.js that runs TypeScript as it is.
      - if: matrix.suite.name == 'unit'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test
        env:
          SUITE: ${{ matrix.suite.name }}
          RUN: ${{ matrix.suite.run }}
          SKIP: ${{ matrix.suite.skip }}
        run: |
          if [ "$SUITE" = unit ]; then
            # Some packages mostly wait, such as the installer's on its
            # transfer deadline: twice as many test binaries as CPUs keep the
            # CPUs busy meanwhile.
            go list ./... | grep -v '/internal/e2e$' | xargs go test -race -p "$((2 * $(getconf _NPROCESSORS_ONLN)))"
          else
            # TestMain builds tmag and the fake agent apart from the test
            # binary, where Go's test cache cannot see them: never reuse a
            # result.
            go test -race -count=1 -v -run "$RUN" -skip "$SKIP" ./internal/e2e | tee "$RUNNER_TEMP/e2e.log"
          fi
      # Main's shards keep the durations the next split works from: each adds
      # its own to the latest record, which shards finishing earlier saved.
      - if: github.ref == 'refs/heads/main' && matrix.suite.name != 'unit'
        uses: actions/cache/restore@v6
        with:
          path: e2e-durations
          key: e2e-durations-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          restore-keys: e2e-durations-
      - name: Record end-to-end durations
        if: github.ref == 'refs/heads/main' && matrix.suite.name != 'unit'
        env:
          OS: ${{ matrix.os }}
        run: |
          touch e2e-durations
          awk -v os="$OS" '/^--- (PASS|FAIL): / { gsub(/[()s]/, "", $4); print os, $3, $4 }' "$RUNNER_TEMP/e2e.log" > measured
          awk '{ w[$1 " " $2] = $3 } END { for (k in w) print k, w[k] }' e2e-durations measured | sort > merged
          mv merged e2e-durations
      - if: github.ref == 'refs/heads/main' && matrix.suite.name != 'unit'
        uses: actions/cache/save@v6
        with:
          path: e2e-durations
          key: e2e-durations-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}

  lint:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ needs.plan.outputs.go }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - name: Shellcheck
        run: shellcheck tmag.tmux scripts/install.sh scripts/tmag plugins/claude/tmag-peers/bin/tmag plugins/codex/tmag-peers/skills/peers/scripts/tmag

  vulncheck:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ needs.plan.outputs.go }}
      # govulncheck publishes no binaries: the latest is built once per
      # version and Go release, then kept.
      - id: govulncheck
        name: Resolve govulncheck
        run: echo "version=$(go list -m -f '{{.Version}}' golang.org/x/vuln@latest)" >> "$GITHUB_OUTPUT"
      - id: govulncheck-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin/govulncheck
          key: govulncheck-${{ steps.govulncheck.outputs.version }}-${{ needs.plan.outputs.go }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.govulncheck-cache.outputs.cache-hit != 'true'
        name: Build govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${{ steps.govulncheck.outputs.version }}"
      - name: Govulncheck
        run: govulncheck ./...

  manifests:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate plugin and marketplace manifests
        run: |
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json \
                   plugins/claude/*/.claude-plugin/plugin.json plugins/claude/tmag/hooks/hooks.json \
                   plugins/codex/*/.codex-plugin/plugin.json plugins/codex/tmag/hooks/hooks.json; do
            jq empty "$f" || { echo "invalid JSON: $f"; exit 1; }
          done

  # The one check to require: it passes when every job passed, or when only
  # documentation changed and the plan skipped them, whatever the matrix. It
  # runs in a cancelled run too, failing there: a skipped check would pass.
  ci:
    if: always()
    needs: [plan, test, lint, vulncheck, manifests]
    runs-on: ubuntu-latest
    steps:
      - env:
          CODE: ${{ needs.plan.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) [ "$CODE" = false ] || { echo "::error::a job was skipped although code changed"; exit 1; } ;;
              *) echo "::error::a job ended $result"; exit 1 ;;
            esac
          done
