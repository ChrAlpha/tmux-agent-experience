name: stress

# Every test several times, on Linux on two CPUs of the runner's four (macOS's
# runners have three), so that a test that fails only sometimes fails here
# before it fails a pull request that did not touch it. Run on a branch, it
# repeats chosen tests:
#   gh workflow run stress.yml --ref BRANCH -f run='^TestName$' -f count=20
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Runs of each test
        type: number
        default: 5
      run:
        description: Only the tests that this go test -run pattern names; empty runs them all
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      count: ${{ inputs.count || 5 }}
      cpus: 2
      run: ${{ inputs.run }}
