name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check version
        run: |
          want="${GITHUB_REF_NAME#v}"
          [ "$(node -p 'require("./package.json").version')" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack
        run: |
          mkdir release
          pnpm pack --pack-destination release
          (cd release && sha256sum -- tmag-flow-*.tgz > checksums.txt)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/tmag-flow-*.tgz
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release/tmag-flow-*.tgz --provenance --access public
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes
