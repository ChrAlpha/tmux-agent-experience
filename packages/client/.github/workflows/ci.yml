name: ci

on:
  push:
    branches: [main]
  pull_request:
  # tmag's main moves without the page: each day tells whether the page
  # still works with it.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The oldest tmag the page works with, the release README.md names; the
  # page is also tested against tmag's main, whose every operation it offers.
  TMAG_REF: v0.7.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  e2e:
    name: e2e (tmag ${{ matrix.tmag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tmag: [oldest, main]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ChrAlpha/tmux-agent-experience
          ref: ${{ matrix.tmag == 'oldest' && env.TMAG_REF || 'main' }}
          path: tmag-src
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # Ubuntu images come with tmux.
      - run: pnpm e2e
        env:
          TMAG_SRC: ${{ github.workspace }}/tmag-src
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.tmag }}
          path: test-results/
